<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title description">
  <title id="title">Temperature forecast on three 8 by 8 LED matrices</title>
  <desc id="description">Illustrative warm-day forecast from midnight to 11 PM. Temperatures dip to 68 F before rising to 88 F. Each hour has one red LED at its fixed temperature band, except 2 PM, which has a yellow LED in the 80 to below 90 F band. Labels are explanatory and are not on the hardware.</desc>
  <defs>
    <g id="column" fill="#26313d">
      <circle cy="0" r="6"/><circle cy="24" r="6"/>
      <circle cy="48" r="6"/><circle cy="72" r="6"/>
      <circle cy="96" r="6"/><circle cy="120" r="6"/>
      <circle cy="144" r="6"/><circle cy="168" r="6"/>
    </g>
    <g id="matrix">
      <rect x="-18" y="-18" width="204" height="204" rx="10" fill="#080d14" stroke="#465362"/>
      <use href="#column" x="0"/><use href="#column" x="24"/>
      <use href="#column" x="48"/><use href="#column" x="72"/>
      <use href="#column" x="96"/><use href="#column" x="120"/>
      <use href="#column" x="144"/><use href="#column" x="168"/>
    </g>
  </defs>
  <rect width="860" height="360" rx="12" fill="#111923"/>
  <g font-family="Arial, sans-serif" fill="#e6edf3">
    <text x="26" y="32" font-size="20" font-weight="bold">Temperature forecast (F)</text>
    <text x="26" y="55" font-size="13" fill="#b3becb">Illustrative data | Current hour: 14:00 (2 PM) | One LED per hour</text>
    <g font-size="12" text-anchor="end">
      <text x="120" y="104">100+</text><text x="120" y="128">90 to &lt;100</text>
      <text x="120" y="152">80 to &lt;90</text><text x="120" y="176">70 to &lt;80</text>
      <text x="120" y="200">60 to &lt;70</text><text x="120" y="224">50 to &lt;60</text>
      <text x="120" y="248">40 to &lt;50</text><text x="120" y="272">&lt;40</text>
    </g>
  </g>
  <g transform="translate(155 100)">
    <use href="#matrix"/>
    <g fill="#ff4149">
      <circle data-hour="0" data-value="73" cx="0" cy="72" r="6"/>
      <circle data-hour="1" data-value="72" cx="24" cy="72" r="6"/>
      <circle data-hour="2" data-value="71" cx="48" cy="72" r="6"/>
      <circle data-hour="3" data-value="70" cx="72" cy="72" r="6"/>
      <circle data-hour="4" data-value="69" cx="96" cy="96" r="6"/>
      <circle data-hour="5" data-value="68" cx="120" cy="96" r="6"/>
      <circle data-hour="6" data-value="69" cx="144" cy="96" r="6"/>
      <circle data-hour="7" data-value="72" cx="168" cy="72" r="6"/>
    </g>
  </g>
  <g transform="translate(371 100)">
    <use href="#matrix"/>
    <g fill="#ff4149">
      <circle data-hour="8" data-value="76" cx="0" cy="72" r="6"/>
      <circle data-hour="9" data-value="79" cx="24" cy="72" r="6"/>
      <circle data-hour="10" data-value="82" cx="48" cy="48" r="6"/>
      <circle data-hour="11" data-value="85" cx="72" cy="48" r="6"/>
      <circle data-hour="12" data-value="87" cx="96" cy="48" r="6"/>
      <circle data-hour="13" data-value="88" cx="120" cy="48" r="6"/>
      <circle data-hour="14" data-value="86" cx="144" cy="48" r="6" fill="#ffd84a"/>
      <circle data-hour="15" data-value="83" cx="168" cy="48" r="6"/>
    </g>
  </g>
  <g transform="translate(587 100)">
    <use href="#matrix"/>
    <g fill="#ff4149">
      <circle data-hour="16" data-value="80" cx="0" cy="48" r="6"/>
      <circle data-hour="17" data-value="78" cx="24" cy="72" r="6"/>
      <circle data-hour="18" data-value="77" cx="48" cy="72" r="6"/>
      <circle data-hour="19" data-value="76" cx="72" cy="72" r="6"/>
      <circle data-hour="20" data-value="75" cx="96" cy="72" r="6"/>
      <circle data-hour="21" data-value="74" cx="120" cy="72" r="6"/>
      <circle data-hour="22" data-value="73" cx="144" cy="72" r="6"/>
      <circle data-hour="23" data-value="72" cx="168" cy="72" r="6"/>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#b3becb" text-anchor="middle">
    <g transform="translate(155 304)">
      <text x="0">00</text><text x="24">01</text><text x="48">02</text><text x="72">03</text>
      <text x="96">04</text><text x="120">05</text><text x="144">06</text><text x="168">07</text>
    </g>
    <g transform="translate(371 304)">
      <text x="0">08</text><text x="24">09</text><text x="48">10</text><text x="72">11</text>
      <text x="96">12</text><text x="120">13</text><text x="144" fill="#ffd84a">14</text><text x="168">15</text>
    </g>
    <g transform="translate(587 304)">
      <text x="0">16</text><text x="24">17</text><text x="48">18</text><text x="72">19</text>
      <text x="96">20</text><text x="120">21</text><text x="144">22</text><text x="168">23</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="12">
    <circle cx="155" cy="334" r="5" fill="#ff4149"/><text x="168" y="338" fill="#e6edf3">Other hours</text>
    <circle cx="285" cy="334" r="5" fill="#ffd84a"/><text x="298" y="338" fill="#e6edf3">Current hour: 86 F</text>
    <text x="587" y="338" fill="#b3becb">Hour labels are not physical LEDs</text>
  </g>
</svg>
